[project]
name = "crowd-counter"
version = "0.2.0"
description = "YOLO-based people tracking, line-crossing, occupancy analytics, and export tooling."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
